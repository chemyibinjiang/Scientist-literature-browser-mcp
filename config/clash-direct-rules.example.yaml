# Clash rule snippet for Scientist literature access.
#
# Paste these rules before generic proxy rules. Campus-entitled publisher
# access should use the local campus/VPN route directly; proxying these domains
# can turn full-text access into abstract-only pages or repeated challenges.
# Add the administrator-provided Research Gateway hostname as an exact DOMAIN
# rule when using the remote gateway from a Clash-managed workstation.
#
# Example:
#   - DOMAIN,scientist.example.edu,DIRECT

