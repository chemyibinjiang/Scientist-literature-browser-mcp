name: scientist-literature-browser-mcp

x-literature-no-proxy: &literature-no-proxy ${LITERATURE_NO_PROXY:-localhost,127.0.0.1,browser,flaresolverr},${LITERATURE_NO_PROXY_EXTRA:-}

services:
  flaresolverr:
    build:
      context: .
      dockerfile: Dockerfile.flaresolverr
    image: ${LITERATURE_FLARESOLVERR_IMAGE:-scientist-literature-flaresolverr:local}
    environment:
      NO_PROXY: *literature-no-proxy
      no_proxy: *literature-no-proxy
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-Asia/Shanghai}
      LANG: en_US
      SCIENTIST_FLARESOLVERR_PUBLISHER_POLICY: /config/publishers.json
      SCIENTIST_FLARESOLVERR_MAX_DOWNLOAD_BYTES: ${LITERATURE_BROWSER_MAX_PDF_BYTES:-67108864}
      SCIENTIST_FLARESOLVERR_MAX_ASSET_BYTES: 8388608
      SCIENTIST_FLARESOLVERR_DOWNLOAD_TTL_SECONDS: 300
    volumes:
      - ./config/publishers.json:/config/publishers.json:ro
    expose:
      - "8191"
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: scientist-literature-browser:local
    environment:
      NO_PROXY: *literature-no-proxy
      no_proxy: *literature-no-proxy
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      TZ: ${TZ:-Asia/Shanghai}
      LITERATURE_PUBLISHER_POLICY: /config/publishers.json
      LITERATURE_SUPPLEMENT_FALLBACKS: /config/supplementary-fallbacks.json
      LITERATURE_BROWSER_HOST: 0.0.0.0
      LITERATURE_BROWSER_PORT: 9020
      LITERATURE_BROWSER_PROFILE: /browser-profile/chromium
      LITERATURE_BROWSER_CHROMIUM: /usr/bin/chromium
      LITERATURE_BROWSER_SCREEN: 1440x1000x24
      LITERATURE_BROWSER_MAX_OPEN_PAGES: ${LITERATURE_BROWSER_MAX_OPEN_PAGES:-2}
      LITERATURE_BROWSER_MAX_PENDING_READS: ${LITERATURE_BROWSER_MAX_PENDING_READS:-8}
      LITERATURE_BROWSER_READ_BUDGET_SECONDS: ${LITERATURE_BROWSER_READ_BUDGET_SECONDS:-480}
      LITERATURE_BROWSER_STALL_GRACE_SECONDS: ${LITERATURE_BROWSER_STALL_GRACE_SECONDS:-30}
      LITERATURE_BROWSER_MAX_PDF_BYTES: ${LITERATURE_BROWSER_MAX_PDF_BYTES:-67108864}
      LITERATURE_BROWSER_PDF_FETCH_TIMEOUT_MS: ${LITERATURE_BROWSER_PDF_FETCH_TIMEOUT_MS:-240000}
      LITERATURE_BROWSER_RENDERER_PROCESS_LIMIT: ${LITERATURE_BROWSER_RENDERER_PROCESS_LIMIT:-8}
      LITERATURE_BROWSER_MAX_CHARS: 0
      LITERATURE_BROWSER_WAIT_MS: 5000
      LITERATURE_FLARESOLVERR_URL: http://flaresolverr:8191/v1
      LITERATURE_FLARESOLVERR_MAX_TIMEOUT_MS: 120000
      LITERATURE_FLARESOLVERR_WAIT_SECONDS: 3
      LITERATURE_FLARESOLVERR_ATTEMPT_TIMEOUT_MS: ${LITERATURE_FLARESOLVERR_ATTEMPT_TIMEOUT_MS:-90000}
      LITERATURE_FLARESOLVERR_MAX_CONCURRENT: ${LITERATURE_FLARESOLVERR_MAX_CONCURRENT:-4}
      LITERATURE_FLARESOLVERR_QUEUE_SECONDS: ${LITERATURE_FLARESOLVERR_QUEUE_SECONDS:-300}
      LITERATURE_FLARESOLVERR_MAINTENANCE_MAX_TIMEOUT_MS: ${LITERATURE_FLARESOLVERR_MAINTENANCE_MAX_TIMEOUT_MS:-45000}
      LITERATURE_ELSEVIER_API_KEY: ${LITERATURE_ELSEVIER_API_KEY:-}
      LITERATURE_ELSEVIER_INSTTOKEN: ${LITERATURE_ELSEVIER_INSTTOKEN:-}
      LITERATURE_ELSEVIER_API_TIMEOUT_SECONDS: ${LITERATURE_ELSEVIER_API_TIMEOUT_SECONDS:-30}
    volumes:
      - browser_profile:/browser-profile
      - ./config/publishers.json:/config/publishers.json:ro
      - ./config/supplementary-fallbacks.json:/config/supplementary-fallbacks.json:ro
    tmpfs:
      - /tmp:mode=1777,uid=10001,gid=10001
    ports:
      - "127.0.0.1:${LITERATURE_BROWSER_PORT:-19020}:9020"
    read_only: true
    shm_size: 512mb
    mem_limit: ${LITERATURE_BROWSER_MEMORY_LIMIT:-768m}
    pids_limit: ${LITERATURE_BROWSER_PIDS_LIMIT:-512}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9020/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      flaresolverr:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: scientist-literature-mcp:local
    environment:
      NO_PROXY: *literature-no-proxy
      no_proxy: *literature-no-proxy
      LITERATURE_BROWSER_URL: http://browser:9020
      LITERATURE_BROWSER_ROUTES_JSON: ${LITERATURE_BROWSER_ROUTES_JSON:-}
      LITERATURE_PUBLISHER_POLICY: /config/publishers.json
      LITERATURE_PROBES_CONFIG: /config/probes.json
      LITERATURE_HEALTH_REPORT: /state/reports/latest.json
    volumes:
      - ./config:/config:ro
      - ./state/reports:/state/reports
    profiles:
      - mcp
    stdin_open: true

  research-gateway:
    image: scientist-literature-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["python3", "-m", "scientist_literature_mcp.http_gateway"]
    environment:
      NO_PROXY: *literature-no-proxy
      no_proxy: *literature-no-proxy
      LITERATURE_BROWSER_URL: http://browser:9020
      LITERATURE_PUBLISHER_POLICY: /config/publishers.json
      LITERATURE_PROBES_CONFIG: /config/probes.json
      LITERATURE_HEALTH_REPORT: /state/reports/latest.json
      RESEARCH_GATEWAY_HOST: 0.0.0.0
      RESEARCH_GATEWAY_PORT: 9040
      RESEARCH_GATEWAY_PUBLIC_URL: ${RESEARCH_GATEWAY_PUBLIC_URL:-https://scientist.example.edu:8318}
      RESEARCH_GATEWAY_MCP_PATH: /mcp/research
      RESEARCH_GATEWAY_KEYS_FILE: /run/secrets/research-gateway/keys.json
      RESEARCH_GATEWAY_AUDIT_LOG: /state/audit/audit.jsonl
    volumes:
      - ./config:/config:ro
      - ./state/reports:/state/reports
      - ${RESEARCH_GATEWAY_KEYS_DIR:-./state/private/research-gateway}:/run/secrets/research-gateway:ro
      - ${RESEARCH_GATEWAY_AUDIT_DIR:-./state/audit}:/state/audit
    ports:
      - "127.0.0.1:${RESEARCH_GATEWAY_PORT:-19040}:9040"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,uid=10002,gid=10002
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9040/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped

  research-key-admin:
    image: scientist-literature-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.mcp
    network_mode: none
    volumes:
      - ${RESEARCH_GATEWAY_KEYS_DIR:-./state/private/research-gateway}:/keys/private
      - ${RESEARCH_GATEWAY_SECRET_OUTPUT_DIR:-./state/private/issued}:/keys/output
    profiles:
      - admin
    command:
      [
        "scientist-research-keys",
        "--config",
        "/keys/private/keys.json",
        "list",
      ]

  policy-admin:
    image: scientist-literature-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.mcp
    network_mode: none
    volumes:
      - ./config:/config
    profiles:
      - admin
    command:
      [
        "python3",
        "-m",
        "scientist_literature_mcp.publisher_policy",
        "--config",
        "/config/publishers.json",
      ]

  monitor:
    image: scientist-literature-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["python3", "-m", "scientist_literature_mcp.monitor"]
    environment:
      NO_PROXY: *literature-no-proxy
      no_proxy: *literature-no-proxy
      LITERATURE_BROWSER_URL: http://browser:9020
      LITERATURE_PUBLISHER_POLICY: /config/publishers.json
      LITERATURE_PROBES_CONFIG: /config/probes.json
      LITERATURE_HEALTH_REPORT: /state/reports/latest.json
      LITERATURE_MONITOR_INTERVAL_SECONDS: ${LITERATURE_MONITOR_INTERVAL_SECONDS:-21600}
      LITERATURE_MONITOR_STARTUP_DELAY_SECONDS: ${LITERATURE_MONITOR_STARTUP_DELAY_SECONDS:-60}
    volumes:
      - ./config:/config:ro
      - ./state/reports:/state/reports
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped

volumes:
  browser_profile:
