# Merge this table into ~/.codex/config.toml or a trusted project's
# .codex/config.toml. Replace the compose path with an absolute local path.
[mcp_servers.scientist_literature]
command = "docker"
args = [
  "compose",
  "-f",
  "C:\\absolute\\path\\to\\literature-browser-mcp\\docker-compose.yml",
  "run",
  "--rm",
  "--no-deps",
  "-T",
  "mcp",
]
startup_timeout_sec = 120
tool_timeout_sec = 7200
enabled = true
required = false
default_tools_approval_mode = "auto"
enabled_tools = [
  "literature_publishers",
  "literature_read",
  "literature_health",
  "literature_probe",
  "literature_session_refresh",
]
